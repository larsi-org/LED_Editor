<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>LED Editor</title>
<script src="https://cdn.jsdelivr.net/npm/p5@1.11.13/lib/p5.min.js"
	integrity="sha384-+4pFSzqrHIcjFoiZQ8s1jUHqNylTGybto+iELDyMA+UQ0UhpTH0B92zF4Bg0mawP"
	crossorigin="anonymous"></script>
<link href="https://cdn.jsdelivr.net/npm/@fortawesome/fontawesome-free@7.3.0/css/all.min.css" rel="stylesheet"
	integrity="sha384-sTlsophtwz/I4myskS3OIJf5VvEojkXKZyBTWZm0YD/K1pN7C5wpBPLyrsbr1SU2" crossorigin="anonymous">
<link rel="stylesheet" href="led-editor.css">
<style>
	/* Page-frame chrome only, specific to this bare page (larsi.org's make/led-editor/
	   index.php has its own site-wide body/link styling from site.css instead) - everything
	   else lives in led-editor.css, loaded above. Inlined rather than its own file since it's
	   just these two rules and only this one page ever used it. */
	body {
		background: var(--bg-page);
		color: var(--text-body);
		font-family: sans-serif;
		padding: 16px;
	}

	a {
		color: var(--link);
	}
</style>
</head>
<body>

<h1>LED Editor</h1>

<div id="led-editor">
	<div id="toolbar">
		<div class="tb-group">
			<label for="layout">Layout</label>
			<select id="layout"></select>
		</div>

		<!-- Each builder in BUILDERS (builders/*.js) injects its own divider+controls here,
		     right before this anchor, at page load - see populateLayoutSelect() in sketch.js -
		     so adding a new builder never needs a new block added here. -->
		<span id="builders-anchor"></span>

		<span class="tb-break"></span>
		<div class="tb-group">
			<label class="tb-checkbox" title="Toggle an LED and its mirror partners together (right-click toggles just one)">
				<input type="checkbox" id="symmetry-toggle" checked>
				Symmetry
			</label>
		</div>

		<span class="tb-divider"></span>
		<div class="tb-group">
			<button class="tb-btn" data-key="c" title="Copy frame (C)"><i class="fas fa-copy"></i> Copy</button>
			<button class="tb-btn" data-key="v" title="Paste frame (V)"><i class="fas fa-paste"></i> Paste</button>
		</div>

		<span class="tb-divider"></span>
		<div class="tb-group">
			<button class="tb-btn" data-key=" " title="Clear frame"><i class="fas fa-eraser"></i> Clear</button>
			<button class="tb-btn" data-key="i" title="Invert frame (I)"><i class="fas fa-circle-half-stroke"></i> Invert</button>
			<button class="tb-btn" data-key="r" title="Randomize frame (R)"><i class="fas fa-shuffle"></i> Random</button>
		</div>
		<span class="tb-divider"></span>
		<div class="tb-group">
			<button class="tb-btn" id="undo-btn" data-key="undo" title="Undo (Ctrl+Z)" aria-label="Undo"><i class="fas fa-rotate-left"></i></button>
			<button class="tb-btn" id="redo-btn" data-key="redo" title="Redo (Ctrl+Y)" aria-label="Redo"><i class="fas fa-rotate-right"></i></button>
		</div>

		<span class="tb-break"></span>
		<div class="tb-group">
			<button class="tb-btn" id="play-btn" title="Play the frames in order (any edit or click in the editor stops it)"><i class="fa fa-play"></i> Play</button>
			<input type="number" id="fps-input" min="1" max="30" step="1" value="4" title="Frames per second">
			<label for="fps-input">fps</label>
		</div>
		<span class="tb-divider"></span>
		<div class="tb-group">
			<button class="tb-btn" data-key="[" title="Duplicate current frame before it ([)"><i class="fas fa-clone"></i> Duplicate Before</button>
			<span id="frame-counter" class="tb-readout" title="Current frame / total frames (, and . step through them)">1 / 1</span>
			<button class="tb-btn" data-key="]" title="Duplicate current frame after it (])"><i class="fas fa-clone"></i> Duplicate After</button>
			<span class="tb-divider"></span>
			<button class="tb-btn" id="delete-btn" data-key="Delete" title="Delete current frame"><i class="fas fa-trash"></i> Delete</button>
		</div>

		<span class="tb-break"></span>
		<div class="tb-group">
			<label class="tb-checkbox" title="Generate packs 8 LEDs per byte (LED 1 = bit 0) instead of one character per LED">
				<input type="checkbox" id="compact-toggle">
				Compact
			</label>
			<button class="tb-btn" data-key="g" title="Generate Arduino code"><i class="fas fa-code"></i> Generate</button>
			<button class="tb-btn" data-key="e" title="Export layout as JSON"><i class="fas fa-file-export"></i> Export Layout</button>
		</div>
	</div>

	<div id="sketch-holder"></div>
</div>

<div id="output" hidden>
	<h2 id="output-title">Arduino code</h2>
	<p id="output-desc">Paste into your sketch. Frames live in flash (<code>PROGMEM</code>); read them with <code>ledOn(frame, led)</code>.</p>
	<textarea id="output-text" rows="12" readonly></textarea>
	<div id="output-buttons">
		<button id="copy-btn">Copy to clipboard</button>
		<button id="close-output-btn">Close</button>
	</div>
</div>

<script src="play-pause-loop.js"></script>
<script src="dist/led-editor.min.js"></script>

</body>
</html>
