<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>LED Editor</title>
<script src="https://cdn.jsdelivr.net/npm/p5@1.11.13/lib/p5.min.js"
	integrity="sha384-+4pFSzqrHIcjFoiZQ8s1jUHqNylTGybto+iELDyMA+UQ0UhpTH0B92zF4Bg0mawP"
	crossorigin="anonymous"></script>
<link href="https://cdn.jsdelivr.net/npm/@fortawesome/fontawesome-free@7.3.0/css/all.min.css" rel="stylesheet"
	integrity="sha384-sTlsophtwz/I4myskS3OIJf5VvEojkXKZyBTWZm0YD/K1pN7C5wpBPLyrsbr1SU2" crossorigin="anonymous">
<link rel="stylesheet" href="style.css">
</head>
<body>

<h1>LED Editor</h1>

<div id="led-editor">
	<div id="toolbar">
		<div class="tb-group">
			<label for="layout">Layout</label>
			<select id="layout"></select>
		</div>

		<span class="tb-divider" id="circle-divider" hidden></span>
		<div class="tb-group" id="circle-controls" hidden>
			<label for="circle-n">N</label>
			<input type="number" id="circle-n" min="3" max="20" value="10">
			<button class="tb-btn" id="circle-build-btn"><i class="fas fa-hammer"></i> Build</button>
		</div>

		<span class="tb-divider" id="hex-divider" hidden></span>
		<div class="tb-group" id="hex-controls" hidden>
			<label for="hex-n">N</label>
			<input type="number" id="hex-n" min="3" max="20" value="10">
			<label class="tb-checkbox" title="Snake wiring: every other row is mirrored, so the strip continues straight into the next row instead of jumping back to the start">
				<input type="checkbox" id="hex-zigzag" checked>
				Zigzag
			</label>
			<button class="tb-btn" id="hex-build-btn"><i class="fas fa-hammer"></i> Build</button>
		</div>

		<span class="tb-divider" id="matrix-divider" hidden></span>
		<div class="tb-group" id="matrix-controls" hidden>
			<label for="matrix-width">W</label>
			<input type="number" id="matrix-width" min="1" max="32" value="8">
			<label for="matrix-height">H</label>
			<input type="number" id="matrix-height" min="1" max="32" value="8">
			<label class="tb-checkbox" title="Snake wiring: every other row is mirrored, so the strip continues straight into the next row instead of jumping back to the start">
				<input type="checkbox" id="matrix-zigzag">
				Zigzag
			</label>
			<button class="tb-btn" id="matrix-build-btn"><i class="fas fa-hammer"></i> Build</button>
		</div>

		<span class="tb-divider"></span>
		<div class="tb-group">
			<label class="tb-checkbox">
				<input type="checkbox" id="symmetry-toggle" checked>
				Symmetry
			</label>
		</div>

		<span class="tb-divider"></span>
		<div class="tb-group">
			<button class="tb-btn" data-key="," aria-label="Previous frame"><i class="fas fa-chevron-left"></i></button>
			<span id="frame-counter" class="tb-readout">1 / 1</span>
			<button class="tb-btn" data-key="." aria-label="Next frame"><i class="fas fa-chevron-right"></i></button>
		</div>

		<span class="tb-divider"></span>
		<div class="tb-group">
			<button class="tb-btn" data-key="c"><i class="fas fa-copy"></i> Copy</button>
			<button class="tb-btn" data-key="v"><i class="fas fa-paste"></i> Paste</button>
		</div>

		<span class="tb-divider"></span>
		<div class="tb-group">
			<button class="tb-btn" data-key=" "><i class="fas fa-eraser"></i> Clear</button>
			<button class="tb-btn" data-key="i"><i class="fas fa-circle-half-stroke"></i> Invert</button>
			<button class="tb-btn" data-key="r"><i class="fas fa-shuffle"></i> Random</button>
		</div>

		<span class="tb-divider"></span>
		<div class="tb-group">
			<button class="tb-btn" data-key="["><i class="fas fa-plus"></i> Insert Before</button>
			<button class="tb-btn" id="delete-btn" data-key="Delete"><i class="fas fa-trash"></i> Delete</button>
			<button class="tb-btn" data-key="]"><i class="fas fa-plus"></i> Insert After</button>
		</div>

		<span class="tb-divider"></span>
		<div class="tb-group">
			<button class="tb-btn" data-key="g"><i class="fas fa-code"></i> Generate</button>
			<button class="tb-btn" data-key="e"><i class="fas fa-file-export"></i> Export Layout</button>
		</div>
	</div>

	<div id="sketch-holder"></div>
</div>

<div id="output" hidden>
	<h2 id="output-title">Generated animation</h2>
	<p id="output-desc">One line per frame, one <code>0</code>/<code>1</code> per LED (order matches the layout's <code>leds</code> list).</p>
	<textarea id="output-text" rows="12" readonly></textarea>
	<div id="output-buttons">
		<button id="copy-btn">Copy to clipboard</button>
		<button id="close-output-btn">Close</button>
	</div>
</div>

<script src="checkbox.js"></script>
<script src="sketch.js"></script>

</body>
</html>
